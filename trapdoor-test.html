<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trapdoor Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1E1F22;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            gap: 50px;
            padding: 40px;
        }

        .trapdoor-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .label {
            color: #888;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* TRAPDOOR LINK - fixed size, no shrinking */
        .trapdoor-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #888;
            text-decoration: none;
            font-size: 14px;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s ease;
            background: transparent;
            cursor: pointer;
            min-width: 70px;
            min-height: 70px;
            box-sizing: border-box;
        }

        .trapdoor-link:hover {
            color: #fff;
            border-color: #c0392b;
            background: rgba(192,57,43,0.08);
        }

        /* Both states use the same container, so size never changes */
        .trapdoor-link .trapdoor-closed,
        .trapdoor-link .trapdoor-open {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .trapdoor-link .trapdoor-open {
            display: none;
        }

        .trapdoor-link:hover .trapdoor-closed {
            display: none;
        }

        .trapdoor-link:hover .trapdoor-open {
            display: flex;
        }

        .trapdoor-icon-sm {
            width: 34px;
            height: 34px;
            display: block;
            flex-shrink: 0;
        }

        .trapdoor-open-text {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
            color: #c0392b;
        }
    </style>
</head>
<body>

    <!-- SMALL VERSION - Fixed box size -->
    <div class="trapdoor-container">
        <span class="label">TRAPDOOR — Small (Fixed Size)</span>
        <a href="#" class="trapdoor-link">
            <span class="trapdoor-closed">
                <svg class="trapdoor-icon-sm" viewBox="0 0 100 100">
                    <!-- Outer frame - dark brown -->
                    <rect x="2" y="2" width="96" height="96" rx="2" fill="#3d2817" stroke="#2a1a0e" stroke-width="2"/>
                    
                    <!-- Wood panel background -->
                    <rect x="6" y="6" width="88" height="88" fill="#6b3f1f"/>
                    
                    <!-- 3 vertical wood panels -->
                    <rect x="8" y="8" width="26" height="84" fill="#7a4a28" stroke="#5a3520" stroke-width="1"/>
                    <rect x="37" y="8" width="26" height="84" fill="#7a4a28" stroke="#5a3520" stroke-width="1"/>
                    <rect x="66" y="8" width="26" height="84" fill="#7a4a28" stroke="#5a3520" stroke-width="1"/>
                    
                    <!-- Wood grain lines -->
                    <line x1="14" y1="12" x2="14" y2="88" stroke="#6b3f1f" stroke-width="1" opacity="0.4"/>
                    <line x1="20" y1="12" x2="20" y2="88" stroke="#6b3f1f" stroke-width="1" opacity="0.4"/>
                    <line x1="26" y1="12" x2="26" y2="88" stroke="#6b3f1f" stroke-width="1" opacity="0.4"/>
                    <line x1="43" y1="12" x2="43" y2="88" stroke="#6b3f1f" stroke-width="1" opacity="0.4"/>
                    <line x1="49" y1="12" x2="49" y2="88" stroke="#6b3f1f" stroke-width="1" opacity="0.4"/>
                    <line x1="55" y1="12" x2="55" y2="88" stroke="#6b3f1f" stroke-width="1" opacity="0.4"/>
                    <line x1="72" y1="12" x2="72" y2="88" stroke="#6b3f1f" stroke-width="1" opacity="0.4"/>
                    <line x1="78" y1="12" x2="78" y2="88" stroke="#6b3f1f" stroke-width="1" opacity="0.4"/>
                    <line x1="84" y1="12" x2="84" y2="88" stroke="#6b3f1f" stroke-width="1" opacity="0.4"/>
                    
                    <!-- TOP HINGE - silver/iron -->
                    <rect x="28" y="2" width="44" height="8" rx="1" fill="#8a8a8a" stroke="#6a6a6a" stroke-width="1"/>
                    <rect x="26" y="4" width="10" height="8" rx="1" fill="#9a9a9a" stroke="#6a6a6a" stroke-width="0.5"/>
                    <rect x="64" y="4" width="10" height="8" rx="1" fill="#9a9a9a" stroke="#6a6a6a" stroke-width="0.5"/>
                    <!-- Hinge screws -->
                    <circle cx="31" cy="6" r="2" fill="#555"/>
                    <circle cx="69" cy="6" r="2" fill="#555"/>
                </svg>
            </span>
            <span class="trapdoor-open">
                <span class="trapdoor-open-text">BTS</span>
            </span>
        </a>
    </div>

</body>
</html>

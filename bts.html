<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
    <style>
        /* Sun spots background - scrolls with page */
        .sun-spots-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            min-height: 100%;
            height: auto;
            overflow: visible;
        }

        .sun-spots {
            position: absolute;
            top: 0%;
            left: 0%;
            right: 0%;
            bottom: 0%;
            background:
                /* 10 GRAIN SPECKS */
                radial-gradient(circle 4px at 5% 10%, rgba(255, 200, 150, 0.5) 0%, transparent 100%),
                radial-gradient(circle 6px at 66.5% 85%, rgba(255, 200, 150, 0.35) 0%, transparent 100%),
                radial-gradient(circle 4px at 95% 15%, rgba(255, 200, 150, 0.45) 0%, transparent 100%),
                radial-gradient(circle 5px at 50% 92%, rgba(255, 200, 150, 0.4) 0%, transparent 100%),
                radial-gradient(circle 3px at 5% 50%, rgba(255, 200, 150, 0.4) 0%, transparent 100%),
                radial-gradient(circle 5px at 95% 59%, rgba(255, 200, 150, 0.35) 0%, transparent 100%);
            opacity: 0.6;
            filter: blur(0.3px) contrast(1.1);
            mix-blend-mode: screen;
        }

        /* Ensure content sits above the sun spots */
        .main-content,
        header,
        footer {
            position: relative;
            z-index: 1;
        }

        body {
            position: relative;
            min-height: 100vh;
            background: #1E1F22;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Remove image labels on hover */
        .bts-image-overlay {
            display: none !important;
        }
    </style>
</head>
